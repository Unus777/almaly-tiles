<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор медиа — Алмалы-Керамик</title>
<link rel="stylesheet" href="style.css">
<style>
  [hidden]{display:none!important}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0}
  .bar input[type=password]{flex:1;min-width:240px;background:var(--card);border:1px solid var(--line);
    color:var(--tx);padding:11px 14px;border-radius:10px;font-size:15px}
  button{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 14px;
    border-radius:10px;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.main{background:var(--accent);border-color:var(--accent);color:#191919;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .hd{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .hd b{font-size:16px}
  .shots{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .shot{width:110px;position:relative}
  .shot img{width:110px;height:146px;object-fit:cover;border-radius:8px;background:#101214;
    border:2px solid transparent}
  .shot.cover img{border-color:var(--accent)}
  .badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#191919;font-size:11px;
    font-weight:700;border-radius:5px;padding:1px 6px}
  .shot{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .shot.dragging{cursor:grabbing;opacity:.85;pointer-events:none;z-index:3;box-shadow:0 12px 28px rgba(0,0,0,.55)}
  .shot .del{position:absolute;top:6px;right:6px;padding:2px 7px;font-size:12px;line-height:1.3;
    background:rgba(15,17,19,.82);border-radius:7px}
  .tip{font-size:12px}
  .drop{order:99;width:110px;height:146px;border:2px dashed var(--line);border-radius:8px;display:flex;
    align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:12px;cursor:pointer;padding:8px}
  #msg{position:fixed;left:0;right:0;bottom:0;background:#1c1f23;border-top:1px solid var(--line);
    padding:10px 20px;font-size:14px;color:var(--dim);display:none}
  .hint{color:var(--dim);font-size:13px;margin:0 0 8px}
  .hint a{color:var(--accent)}
</style>

<header><div class="wrap head">
  <a class="logo" href="index.html">Алмалы<span>·</span>Керамик</a>
  <span class="sub">Редактор медиа</span>
  <a class="navlink" href="index.html">Каталог</a>
</div></header>

<main class="wrap">
  <div class="bar" id="auth">
    <input type="password" id="token" placeholder="GitHub-токен с правом Contents: read and write" autocomplete="off">
    <button class="main" id="login">Войти</button>
    <button id="logout" hidden>Выйти</button>
  </div>
  <p class="hint" id="hint">Токен хранится только в этом браузере и никуда больше не отправляется, кроме GitHub.
    Создать: <a href="https://github.com/settings/personal-access-tokens" target="_blank">Fine-grained token</a>
    → доступ к репозиторию <b>almaly-tiles</b> → Repository permissions → Contents: Read and write.</p>

  <div class="tools" id="tools" hidden>
    <input type="search" id="q" placeholder="Поиск: название или артикул" aria-label="Поиск">
    <select id="only"><option value="">Все модели</option><option value="no">Без фото</option><option value="yes">С фото</option></select>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</main>
<div id="msg"></div>

<script src="dnd.js"></script>
<script>
const REPO = 'Unus777/almaly-tiles', BRANCH = 'main';
const $ = s => document.querySelector(s);
let token = localStorage.getItem('gh_token') || '', tiles = [], files = {};

const msg = (t, keep) => { const m = $('#msg'); m.textContent = t; m.style.display = t ? 'block' : 'none';
  if (t && !keep) setTimeout(() => { if (m.textContent === t) m.style.display = 'none'; }, 4000); };

const HINTS = {
  401: 'токен недействителен или отозван — нажми «Выйти» и вставь новый',
  403: 'у токена нет права Contents: Read and write — пересоздай токен с этим правом',
  404: 'токен не видит репозиторий — при создании выбери Only select repositories → almaly-tiles',
  409: 'репозиторий изменился, попробуй ещё раз',
  422: 'репозиторий изменился, попробуй ещё раз'
};

async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, {
    ...opts, headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', ...opts.headers}});
  const d = r.status === 204 ? {} : await r.json();
  if (!r.ok) {
    const e = new Error(HINTS[r.status] || d.message || `код ${r.status}`);
    e.status = r.status;
    throw e;
  }
  return d;
}

/** Уменьшает фото до 1600px и отдаёт base64 без префикса. */
const shrink = file => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', .85).split(',')[1]);
  };
  img.onerror = rej;
  img.src = URL.createObjectURL(file);
});

/** Один коммит с набором операций: [{path, content}] и [{path: null-удалить}]. */
async function commit(message, ops, retry = true) {
  try {
    return await commitOnce(message, ops);
  } catch (e) {
    if (!retry || ![409, 422].includes(e.status)) throw e;
    return commitOnce(message, ops);          // ветка уехала вперёд — пробуем на свежей голове
  }
}

async function commitOnce(message, ops) {
  const head = await gh(`/git/refs/heads/${BRANCH}`);
  const base = await gh(`/git/commits/${head.object.sha}`);
  const tree = [];
  for (const op of ops) {
    if (op.remove) tree.push({path: op.path, mode: '100644', type: 'blob', sha: null});
    else if (op.sha) tree.push({path: op.path, mode: '100644', type: 'blob', sha: op.sha});
    else {
      const blob = await gh('/git/blobs', {method: 'POST',
        body: JSON.stringify({content: op.content, encoding: 'base64'})});
      tree.push({path: op.path, mode: '100644', type: 'blob', sha: blob.sha});
    }
  }
  const t = await gh('/git/trees', {method: 'POST',
    body: JSON.stringify({base_tree: base.tree.sha, tree})});
  const c = await gh('/git/commits', {method: 'POST',
    body: JSON.stringify({message, tree: t.sha, parents: [head.object.sha]})});
  await gh(`/git/refs/heads/${BRANCH}`, {method: 'PATCH', body: JSON.stringify({sha: c.sha})});
}

async function loadFiles() {
  const tree = await gh(`/git/trees/${BRANCH}?recursive=1`);
  files = {};
  tree.tree.filter(x => x.type === 'blob' && x.path.startsWith('photos/'))
    .forEach(x => { const [, art, f] = x.path.split('/'); (files[art] ||= []).push({f, sha: x.sha}); });
  Object.values(files).forEach(a => a.sort((a, b) => a.f.localeCompare(b.f)));
}

const raw = (art, f) => `https://raw.githubusercontent.com/${REPO}/${BRANCH}/photos/${art}/${f}`;

function draw() {
  const s = $('#q').value.trim().toLowerCase(), only = $('#only').value;
  const list = tiles.filter(t => {
    const ph = files[t.art] || [];
    return (!s || (t.name + ' ' + t.art).toLowerCase().includes(s)) &&
           (!only || (only === 'yes') === (ph.length > 0));
  });
  $('#count').textContent = `${list.length} из ${tiles.length}`;
  $('#list').innerHTML = list.map(t => {
    const ph = files[t.art] || [];
    return `<section class="tile" data-art="${t.art}">
      <div class="hd"><b>${t.name}</b><span class="art">${t.art}</span>
        <a class="navlink" href="tile.html?a=${t.art}" target="_blank">открыть на сайте ↗</a>
        <span class="meta">${t.format} · ${t.surface} · ${ph.length} фото</span>
        ${ph.length > 1 ? '<span class="meta tip">перетащи фото, чтобы поменять порядок · первое — обложка</span>' : ''}</div>
      <div class="shots">
        ${ph.map(({f}, i) => `<div class="shot ${i ? '' : 'cover'}" data-f="${f}">
          <img src="${raw(t.art, f)}" alt="" loading="lazy" draggable="false">
          ${i ? '' : '<span class="badge">обложка</span>'}
          <button class="del" data-act="del" data-f="${f}" title="Удалить">✕</button>
        </div>`).join('')}
        <label class="drop">+ добавить фото<input type="file" accept="image/*" multiple hidden></label>
      </div></section>`;
  }).join('') || '<p class="meta">Ничего не найдено.</p>';
}

/** Перекладывает фото артикула в новый порядок: имена 01..NN. */
async function reorder(art, order) {
  const dels = (files[art] || []).map(p => ({path: `photos/${art}/${p.f}`, remove: true}));
  const adds = order.map((p, i) => ({path: `photos/${art}/${String(i + 1).padStart(2, '0')}.jpg`, sha: p.sha}));
  await commit(`Порядок фото ${art}`, [...dels, ...adds]);
  files[art] = adds.map(a => ({f: a.path.split('/')[2], sha: a.sha}));
  draw();
}

$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act=del]'); if (!b) return;
  const art = b.closest('.tile').dataset.art;
  const ph = [...(files[art] || [])], i = ph.findIndex(p => p.f === b.dataset.f);
  if (!confirm('Удалить это фото?')) return;
  try {
    b.disabled = true; msg('Удаляю…', true);
    ph.splice(i, 1);
    await reorder(art, ph);
    msg('Готово. Сайт обновится через 1–2 минуты.');
  } catch (err) { msg('Ошибка: ' + err.message); draw(); } finally { b.disabled = false; }
});

enableDnd($('#list'), async (art, order) => {
  try {
    msg('Сохраняю порядок…', true);
    await reorder(art, order.map(f => (files[art] || []).find(p => p.f === f)));
    msg('Порядок сохранён. Сайт обновится через 1–2 минуты.');
  } catch (err) { msg('Ошибка: ' + err.message); draw(); }
});

$('#list').addEventListener('change', async e => {
  if (e.target.type !== 'file' || !e.target.files.length) return;
  const art = e.target.closest('.tile').dataset.art;
  try {
    msg('Загружаю фото…', true);
    const start = (files[art] || []).length;
    const ops = [];
    for (const [i, file] of [...e.target.files].entries())
      ops.push({path: `photos/${art}/${String(start + i + 1).padStart(2, '0')}.jpg`, content: await shrink(file)});
    await commit(`Фото ${art}`, ops);
    await loadFiles();
    draw();
    msg('Загружено. Сайт обновится через 1–2 минуты.');
  } catch (err) { msg('Ошибка: ' + err.message); }
});

async function start() {
  try {
    msg('Загружаю каталог…', true);
    const repo = await gh('');
    if (repo.permissions && !repo.permissions.push)
      throw new Error('у токена только чтение — нужен доступ Contents: Read and write');
    tiles = (await fetch('data.json?v=' + Date.now()).then(r => r.json())).tiles;
    $('#q').value = new URLSearchParams(location.search).get('a') || '';
    await loadFiles();
    $('#tools').hidden = false; $('#hint').hidden = true;
    $('#token').hidden = true; $('#login').hidden = true; $('#logout').hidden = false;
    ['q', 'only'].forEach(id => $('#' + id).addEventListener('input', draw));
    draw(); msg('');
  } catch (err) { msg('Не получилось войти: ' + err.message); }
}

$('#login').addEventListener('click', () => {
  token = $('#token').value.trim();
  if (!token) return msg('Вставь токен');
  localStorage.setItem('gh_token', token); start();
});
$('#logout').addEventListener('click', () => { localStorage.removeItem('gh_token'); location.reload(); });
if (token) start();
</script>
