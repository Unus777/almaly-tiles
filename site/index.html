<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Алмалы-Керамик — каталог керамогранита</title>
<link rel="stylesheet" href="style.css">
<header><div class="wrap head">
  <a class="logo" href="index.html">Алмалы<span>·</span>Керамик</a>
  <span class="sub">Керамогранит 60×60 и 60×120</span>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>Каталог керамогранита</h1>
    <p>Реальные фото каждой модели. Наведите камеру на QR-код рядом с плиткой — откроется страница этой модели с полной галереей.</p>
  </section>

  <div class="tools">
    <input type="search" id="q" placeholder="Поиск: название или артикул" aria-label="Поиск">
    <select id="fmt" aria-label="Формат"><option value="">Все форматы</option></select>
    <select id="srf" aria-label="Покрытие"><option value="">Все покрытия</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
</main>
<footer class="wrap">ООО «Алмалы-Керамик» · <span id="stat"></span></footer>
<script src="app.js"></script>
<script>renderCatalog()</script>
